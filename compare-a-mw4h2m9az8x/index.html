<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAPI CAPI — Systems · Sound · Signal</title>
<meta name="description" content="Portfolio of Capi Capi — a dark-future, neon-tech showcase.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<header class="topbar glass">
  <div class="logo" data-reveal>CAPI<span>//</span>CAPI</div>
  <nav>
    <a href="#about">About</a>
    <a href="#work">Work</a>
    <a href="#contact">Contact</a>
  </nav>
  <div class="status"><i></i><span id="status-text">SYS ONLINE</span></div>
</header>

<main>
  <section class="hero" id="top">
    <p class="eyebrow" data-hero>// PORTFOLIO_v2.077</p>
    <h1 id="title" aria-label="Capi Capi">CAPI CAPI</h1>
    <p class="tagline" id="tagline" data-hero>Engineering signal from noise.</p>
    <a class="cta" href="#work" data-hero><span>Enter the grid</span><b>→</b></a>
    <div class="scroll-hint" data-hero>SCROLL</div>
  </section>

  <section id="about" class="panel">
    <h2 class="sec-title" data-split>ABOUT</h2>
    <div class="glass card about-card" data-card>
      <p id="about-text"></p>
      <ul id="skills" class="chips"></ul>
    </div>
  </section>

  <section id="work" class="panel">
    <h2 class="sec-title" data-split>SELECTED WORK</h2>
    <div id="projects" class="grid"></div>
  </section>

  <section id="contact" class="panel">
    <h2 class="sec-title" data-split>CONTACT</h2>
    <div class="glass card" data-card>
      <p id="contact-text"></p>
      <a id="contact-link" class="cta" href="#"><span>Open channel</span><b>→</b></a>
    </div>
  </section>

  <footer>© <span id="year"></span> CAPI CAPI — all signals reserved.</footer>
</main>

<aside class="player glass" id="player" aria-label="Music player">
  <div class="p-head">
    <div class="p-meta">
      <div class="p-label">NOW PLAYING</div>
      <div class="p-title" id="p-title">Loading…</div>
      <div class="p-sub" id="p-sub"></div>
    </div>
    <button class="p-min" id="p-min" aria-label="Collapse player">–</button>
  </div>
  <div class="p-body">
    <canvas id="viz" width="300" height="48"></canvas>
    <div class="seek">
      <span id="t-cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span id="t-dur">0:00</span>
    </div>
    <div class="controls">
      <button id="prev" aria-label="Previous">⏮</button>
      <button id="play" class="main" aria-label="Play">▶</button>
      <button id="next" aria-label="Next">⏭</button>
      <div class="vol">
        <span>VOL</span>
        <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume">
      </div>
    </div>
    <ol id="playlist" class="playlist"></ol>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
</body>
</html>
